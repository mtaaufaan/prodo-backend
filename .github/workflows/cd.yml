# ============================================================
# PRODO Backend — CD Pipeline
# Trigger: push ke main (setelah merge PR)
# Jobs: build-push-image (build Docker image + push ke Harbor)
#
# Secrets yang dibutuhkan di GitHub repo settings:
#   HARBOR_USERNAME  — akun Harbor registry
#   HARBOR_PASSWORD  — password Harbor registry
#
# Registry: harbor.prodo.internal
# Image:    harbor.prodo.internal/prodo/backend:<tag>
# Tags:     sha-<git-sha-pendek>, latest, semver (jika release)
# ============================================================

name: CD Backend

on:
  push:
    branches:
      - main
  # Trigger manual jika perlu
  workflow_dispatch:
    inputs:
      push_latest:
        description: 'Tag image sebagai :latest'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: harbor.prodo.internal
  IMAGE_NAME: harbor.prodo.internal/prodo/backend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Setup Docker Buildx (untuk layer caching) ───────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Harbor belum tersedia (dev/S0) ───────────────────────
      # Tidak ada instance Harbor sungguhan sampai infra produksi
      # disiapkan -- HARBOR_USERNAME/HARBOR_PASSWORD sengaja kosong.
      # Step login/build-push di-skip (bukan fail) selama secret ini
      # kosong, supaya CD tidak menampilkan red-X palsu di setiap push
      # ke main. Begitu Harbor sungguhan ada, set kedua secret di GitHub
      # repo settings dan step-step ini otomatis aktif kembali.
      - name: Cek kredensial Harbor tersedia
        id: check-harbor
        run: |
          if [ -n "${{ secrets.HARBOR_USERNAME }}" ]; then
            echo "has-credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-credentials=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HARBOR_USERNAME belum di-set -- build+push Harbor di-skip. Lihat docs/environment-setup.md."
          fi

      # ── Login ke Harbor registry ────────────────────────────
      - name: Login to Harbor
        if: steps.check-harbor.outputs.has-credentials == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # ── Generate image tags & labels ─────────────────────────
      # Tags yang dihasilkan:
      #   harbor.prodo.internal/prodo/backend:sha-<7 char sha>
      #   harbor.prodo.internal/prodo/backend:latest (hanya di main)
      #   harbor.prodo.internal/prodo/backend:v1.2.3 (jika push tag)
      - name: Extract metadata (tags & labels)
        if: steps.check-harbor.outputs.has-credentials == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=PRODO Backend
            org.opencontainers.image.description=PRODO Enterprise Task Management — Backend API
            org.opencontainers.image.vendor=mtaaufaan
            prodo.git.sha=${{ github.sha }}
            prodo.build.run=${{ github.run_id }}

      # ── Build dan push image ─────────────────────────────────
      - name: Build and push Docker image
        if: steps.check-harbor.outputs.has-credentials == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build args untuk embed di binary
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # Cache: gunakan registry cache untuk mempercepat build CI
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64

      # ── Summary ──────────────────────────────────────────────
      - name: Summary
        if: steps.check-harbor.outputs.has-credentials == 'true'
        run: |
          echo "## 🚀 Image berhasil di-push ke Harbor" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | while read tag; do
            echo "  - \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Summary (Harbor skipped)
        if: steps.check-harbor.outputs.has-credentials != 'true'
        run: |
          echo "## ⏭️ Push ke Harbor di-skip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`HARBOR_USERNAME\`/\`HARBOR_PASSWORD\` belum di-set di repo secrets --" >> $GITHUB_STEP_SUMMARY
          echo "belum ada instance Harbor sungguhan di lingkungan ini (S0)." >> $GITHUB_STEP_SUMMARY
          echo "Set kedua secret di GitHub repo settings begitu Harbor tersedia." >> $GITHUB_STEP_SUMMARY
